name: hookkadr
description: HOOKKADR mobile video studio for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  animate_do: ^5.1.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  ffmpeg_kit_flutter_new_full: ^2.5.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_ai_toolkit: ^1.0.0
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  gal: ^2.3.3
  google_fonts: ^6.3.3
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  kadr_diffusion:
    path: packages/kadr_diffusion
  kadr_llm:
    path: packages/kadr_llm
  liquid_glass_easy: 4.3.4
  lucide_icons_flutter: ^3.1.24
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/images/launcher_icon.png
    - assets/images/studio_hero.png
    - assets/images/template_product.png
    - assets/fonts/Inter.ttf
    - assets/models/scene_quality.json
