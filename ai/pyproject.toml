[project]
name = "hookkadr-ai"
version = "0.1.0"
description = "HOOKKADR's own AI: datasets, training, evaluation, model registry and inference service."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "imageio-ffmpeg>=0.6",
    "torch>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hookkadr_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
